services:
  postgres:
    image: postgres:16-alpine
    container_name: trmnl_byos_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=byos_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - byos_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  byos-next:
    # Build from the local fork checkout instead of pulling the prebuilt image.
    # To revert to the upstream prebuilt image, swap these two lines:
    build:
      context: .
      dockerfile: Dockerfile
    # image: ghcr.io/usetrmnl/byos_next:latest
    container_name: trmnl_byos_next
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/byos_db?sslmode=disable
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - byos_network

volumes:
  postgres_data:
    driver: local

networks:
  byos_network:
    driver: bridge
